name: Quality Gate - React App

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar calidad de código con ESLint
        run: npm run lint

      - name: Compilar aplicación React
        run: npm run build

      - name: Almacenar artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/